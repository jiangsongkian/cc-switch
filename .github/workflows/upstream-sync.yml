name: Upstream Sync & Fork Release

# 个人 fork 专用：每晚把 feat/rules-redesign rebase 到 upstream/main，需要时构建
# macOS arm64 包并发 Release，供应用内 updater 使用。
#
# 构建条件（满足任一）：
#   - rebase 后上游 tauri.conf.json 的 version 变化
#   - 手动触发并勾选 force_build
#   - 当前上游版本还没有 rules-v<version>-fork.* 的 Release（首次构建 / 上次构建失败）
#
# 产物版本形如 4.0.33-fork.1：updater 用 semver 比较，同版本重发不会被推送，
# 所以每次构建递增 -fork.N；CFBundleVersion 单独设成纯数字的上游版本。
on:
  schedule:
    - cron: "23 3 * * *" # 每天 11:23（北京时间）
  workflow_dispatch:
    inputs:
      force_build:
        description: "即使上游版本没变也构建发版"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  BRANCH: feat/rules-redesign
  UPSTREAM_REPO: farion1231/cc-switch
  UPSTREAM_BRANCH: main
  CONFLICT_LABEL: upstream-conflict

jobs:
  sync:
    name: Rebase onto upstream
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.out.outputs.sha }}
      base_version: ${{ steps.gate.outputs.base_version }}
      build: ${{ steps.gate.outputs.build }}
    steps:
      - name: Checkout fork branch
        uses: actions/checkout@v6
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0

      # 公钥还是占位符的话，签出来的包永远过不了 updater 校验，早失败比白跑 60 分钟好
      - name: Ensure fork signing pubkey is configured
        run: |
          if grep -q 'REPLACE_ME_WITH_YOUR_MINISIGN_PUBLIC_KEY' src-tauri/tauri.macos.conf.json; then
            echo "src-tauri/tauri.macos.conf.json 里的 pubkey 还是占位符，填入自建 minisign 公钥后再跑。" >&2
            exit 1
          fi

      - name: Rebase onto upstream/main
        id: rebase
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch --no-tags upstream "${UPSTREAM_BRANCH}"

          before_sha=$(git rev-parse HEAD)
          before_version=$(git show HEAD:src-tauri/tauri.conf.json | jq -r .version)

          if ! git rebase "upstream/${UPSTREAM_BRANCH}" > "$RUNNER_TEMP/rebase.log" 2>&1; then
            conflicts=$(git diff --name-only --diff-filter=U | paste -sd ', ' - || true)
            # 先中止，任何情况下都不留下半完成的 rebase
            git rebase --abort
            tail -n 40 "$RUNNER_TEMP/rebase.log" || true

            gh label create "${CONFLICT_LABEL}" --repo "${GITHUB_REPOSITORY}" \
              --color FBCA04 --force >/dev/null 2>&1 || true
            body=$(printf '自动 rebase 到 `upstream/%s` 时冲突，已中止，分支未被改写。\n\n冲突文件：\n\n```\n%s\n```\n\n运行记录：%s' \
              "${UPSTREAM_BRANCH}" "${conflicts:-（未能读取冲突文件列表）}" \
              "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")
            existing=$(gh issue list --repo "${GITHUB_REPOSITORY}" \
              --label "${CONFLICT_LABEL}" --state open --json number --jq '.[0].number // empty')
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --repo "${GITHUB_REPOSITORY}" --body "$body"
            else
              gh issue create --repo "${GITHUB_REPOSITORY}" \
                --title "上游同步冲突 $(date -u +%F)" \
                --label "${CONFLICT_LABEL}" \
                --body "$body"
            fi
            exit 1
          fi

          after_sha=$(git rev-parse HEAD)
          after_version=$(jq -r .version src-tauri/tauri.conf.json)

          if [ "$after_sha" != "$before_sha" ]; then
            # checkout 出来的可能是 detached HEAD，显式推到分支名
            git push --force-with-lease origin "HEAD:refs/heads/${BRANCH}"
          fi

          # 冲突解决后自动收起旧的冲突 issue
          stale=$(gh issue list --repo "${GITHUB_REPOSITORY}" \
            --label "${CONFLICT_LABEL}" --state open --json number --jq '.[0].number // empty')
          if [ -n "$stale" ]; then
            gh issue comment "$stale" --repo "${GITHUB_REPOSITORY}" \
              --body "已恢复：rebase 成功（\`${after_sha}\`）。"
            gh issue close "$stale" --repo "${GITHUB_REPOSITORY}"
          fi

          version_changed=false
          if [ "$after_version" != "$before_version" ]; then version_changed=true; fi
          echo "rebase: ${before_sha:0:10} -> ${after_sha:0:10}, version: ${before_version} -> ${after_version}"
          {
            echo "version_changed=${version_changed}"
            echo "after_version=${after_version}"
          } >> "$GITHUB_OUTPUT"

      - name: Expose commit
        id: out
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Decide whether to build
        id: gate
        shell: bash
        env:
          # schedule 触发时 inputs 为空，默认不强制构建
          FORCE_BUILD: ${{ inputs.force_build || 'false' }}
          VERSION_CHANGED: ${{ steps.rebase.outputs.version_changed }}
        run: |
          set -euo pipefail
          base=$(jq -r .version src-tauri/tauri.conf.json)
          echo "base_version=${base}" >> "$GITHUB_OUTPUT"

          build=false
          if [ "$FORCE_BUILD" = "true" ] || [ "$VERSION_CHANGED" = "true" ]; then
            build=true
          elif ! git ls-remote --tags origin "refs/tags/rules-v${base}-fork.*" | grep -q .; then
            # 这个上游版本还没有 Release：首次构建，或上次构建失败（失败时不打 tag）
            build=true
          fi
          echo "build=${build} (base=${base}, version_changed=${VERSION_CHANGED}, force=${FORCE_BUILD})"
          echo "build=${build}" >> "$GITHUB_OUTPUT"

  build:
    name: Build macOS arm64 & release
    needs: sync
    if: needs.sync.outputs.build == 'true'
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout rebased commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.sync.outputs.sha }}
          fetch-depth: 0

      # 版本取 package.json 的 packageManager，和主 CI 保持一致
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      # rust-toolchain.toml 是编译器版本的唯一来源，和上游 release.yml 保持一致
      - name: Read pinned Rust toolchain
        id: rust-toolchain
        shell: bash
        run: |
          channel=$(sed -nE 's/^channel *= *"([^"]+)".*/\1/p' rust-toolchain.toml)
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          targets: aarch64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Prepare Tauri signing key
        uses: ./.github/actions/prepare-tauri-signing-key
        with:
          private-key: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          password: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # 每次构建递增 -fork.N，updater 才会认为是新版本（同版本重发不会被推送）。
      # 版本通过 --config 覆盖，不改仓库里的 tauri.conf.json，避免给 rebase 制造冲突。
      - name: Compute fork version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          base=$(jq -r .version src-tauri/tauri.conf.json)
          existing=$(git ls-remote --tags origin "refs/tags/rules-v${base}-fork.*" \
            | sed 's/.*refs\/tags\///; s/\^{}$//' || true)
          last=$(printf '%s\n' "$existing" | sed -nE 's/.*-fork\.([0-9]+)$/\1/p' | sort -n | tail -1)
          n=$(( ${last:-0} + 1 ))
          version="${base}-fork.${n}"
          tag="rules-v${version}"

          # CFBundleVersion 必须是纯数字，单独设成上游版本
          jq -n --arg v "$version" --arg b "$base" \
            '{version:$v, bundle:{macOS:{bundleVersion:$b}}}' > "$RUNNER_TEMP/version.json"

          echo "version=${version}"
          cat "$RUNNER_TEMP/version.json"
          {
            echo "version=${version}"
            echo "tag=${tag}"
          } >> "$GITHUB_OUTPUT"

      # createUpdaterArtifacts 会同时产出 .app.tar.gz 与 .sig。
      # 不能加 --no-sign：CLI 里它同时会跳过 updater 的 minisign 签名
      # ("Updater signing is skipped due to --no-sign flag.")，那样没有 .sig，自动更新失效。
      # 代码签名由 tauri.macos.conf.json 的 signingIdentity "-" 做 ad-hoc 签名。
      - name: Build app bundle
        env:
          VERSION_CONFIG: ${{ runner.temp }}/version.json
        run: |
          pnpm tauri build --ci \
            --target aarch64-apple-darwin \
            --bundles app \
            --config "$VERSION_CONFIG"

      - name: Verify bundle
        shell: bash
        run: |
          set -euo pipefail
          B="src-tauri/target/aarch64-apple-darwin/release/bundle/macos"
          APP="$B/CC Switch.app"
          test -d "$APP"
          test -f "$B/CC Switch.app.tar.gz"
          test -f "$B/CC Switch.app.tar.gz.sig"

          arch=$(file -b "$APP/Contents/MacOS/cc-switch")
          grep -q 'arm64' <<< "$arch"

          # ad-hoc 签名必须存在，否则从 dmg 装出来的 app 会被报「已损坏」
          codesign --verify --deep --strict "$APP"
          sig=$(codesign -dv --verbose=4 "$APP" 2>&1)
          grep -q 'Signature=adhoc' <<< "$sig"

          # 平台配置真的被合并进去了：endpoint 指向自己的 fork
          grep -aq 'github.com/jiangsongkian/cc-switch/releases/latest/download/latest.json' \
            "$APP/Contents/MacOS/cc-switch"
          ! grep -aq 'dl.ccswitch.io' "$APP/Contents/MacOS/cc-switch"

          echo "CFBundleShortVersionString: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")"
          echo "CFBundleVersion: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Contents/Info.plist")"

      - name: Prepare release assets
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          B="src-tauri/target/aarch64-apple-darwin/release/bundle/macos"
          APP="$B/CC Switch.app"

          mkdir -p release-assets
          cp "$B/CC Switch.app.tar.gz" "release-assets/CC-Switch-rules-${VERSION}-macOS.app.tar.gz"
          cp "$B/CC Switch.app.tar.gz.sig" "release-assets/CC-Switch-rules-${VERSION}-macOS.app.tar.gz.sig"

          # hdiutil -srcfolder 是把该目录的「内容」铺到卷根，直接传 .app 会做出一个根目录
          # 是 Contents/ 的坏 dmg。先 ditto 到一个只含 app bundle 的暂存目录（ditto 保留
          # 签名和扩展属性）。
          STAGE="$RUNNER_TEMP/dmg-stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          ditto "$APP" "$STAGE/CC Switch.app"

          # 用 hdiutil 而不是 tauri 的 dmg bundler：无 Finder/AppleScript 依赖，CI 上更稳。
          hdiutil create \
            -volname "CC Switch" \
            -srcfolder "$STAGE" \
            -ov -format UDZO \
            "release-assets/CC-Switch-rules-${VERSION}-macOS.dmg"

          ls -lh release-assets

      - name: Generate latest.json
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          sig=$(cat "release-assets/CC-Switch-rules-${VERSION}-macOS.app.tar.gz.sig")
          url="https://github.com/${REPO}/releases/download/${TAG}/CC-Switch-rules-${VERSION}-macOS.app.tar.gz"
          jq -n \
            --arg version "$VERSION" \
            --arg notes "Fork build ${VERSION}" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg sig "$sig" \
            --arg url "$url" \
            '{version:$version, notes:$notes, pub_date:$pub_date,
              platforms:{"darwin-aarch64":{signature:$sig, url:$url}}}' \
            > release-assets/latest.json
          cat release-assets/latest.json

      # draft -> 上传全部资产 -> 发布：避免 releases/latest 一度指向缺资产的 release。
      # 必须是非 prerelease，releases/latest 才会解析到它；
      # tag 用 rules-v*，不会触发上游 release.yml 的 v* 规则。
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}
          BASE: ${{ needs.sync.outputs.base_version }}
          SHA: ${{ needs.sync.outputs.sha }}
        run: |
          set -euo pipefail
          printf 'Personal fork build with the rules management feature.\n\n- Version: `%s`\n- Upstream version: `%s`\n- Commit: `%s`\n- Platform: macOS arm64\n' \
            "$VERSION" "$BASE" "$SHA" > "$RUNNER_TEMP/notes.md"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft \
              --target "$SHA" \
              --title "Rules build ${VERSION}" \
              --notes-file "$RUNNER_TEMP/notes.md"
            gh release upload "$TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          fi

          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,assets \
            --jq '{tag:.tagName, draft:.isDraft, assets:[.assets[].name]}'
